[package]
name = "fuide-player"
description = "Audio / video player with a Sci-Fi FUI look, built on egui and AVFoundation"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "fuide_player"
path = "src/lib.rs"

[[bin]]
name = "fuide-player"
path = "src/main.rs"

# AVFoundation delivers its state on the main thread's run loop, which cargo's test harness
# does not run: the engine is exercised by a harness-less test that owns the main thread.
[[test]]
name = "engine"
harness = false

[dependencies]
egui = { workspace = true }
eframe = { workspace = true }
fuide = { workspace = true }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSDictionary", "NSValue", "NSError", "NSObject", "NSEnumerator", "NSLocale", "NSAttributedString"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-core-media", "objc2-core-video", "objc2-core-foundation",
    "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVAssetTrack", "AVPlayerItemTrack",
    "AVMediaFormat", "AVMetadataItem", "AVMetadataFormat", "AVAsynchronousKeyValueLoading", "AVTime",
    "AVAudioMix", "AVAudioProcessingSettings", "objc2-media-toolbox", "objc2-uniform-type-identifiers",
    "AVMediaSelectionGroup", "AVMediaSelection", "AVTimedMetadataGroup", "AVMetadataObject", "dispatch2",
] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime", "CMTimeRange", "CMFormatDescription", "objc2-core-audio-types"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn", "objc2-io-surface"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFString", "CFRunLoop", "CFDate"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-uniform-type-identifiers", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication"] }
block2 = "0.6"
dispatch2 = "0.3"
objc2-media-toolbox = { version = "0.3", default-features = false, features = ["std", "MTAudioProcessingTap", "objc2-core-audio-types", "objc2-core-media"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "objc2-core-foundation"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLPixelFormat", "MTLResource", "MTLTypes", "objc2-io-surface"] }
egui-wgpu = "0.36.1"
wgpu = { version = "30", default-features = false, features = ["metal"] }

[dev-dependencies]
# end-to-end tests through the accessibility tree + wgpu-rendered snapshots (`src/app/e2e.rs`)
egui_kittest = { version = "0.36.1", features = ["eframe", "wgpu", "snapshot"] }

# `cargo bundle --release --format dmg -p fuide-player` (see scripts/release.sh)
[package.metadata.bundle]
name = "FUIDE Player"
identifier = "fuide.player"
short_description = "Audio / video player with a Sci-Fi FUI look"
# paths are resolved from the directory `cargo bundle` runs in (workspace root; see scripts/release.sh)
icon = ["assets/icons/player.svg"]
category = "public.app-category.video"
copyright = "Copyright (c) 2026 Go Kobayashi"
osx_minimum_system_version = "13.0"
