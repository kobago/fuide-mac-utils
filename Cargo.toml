[workspace]
resolver = "2"
members = ["apps/file-manager", "apps/brew", "apps/player", "apps/activity-monitor"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
egui = "0.36.1"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu"] }
# The FUI kit lives in its own repo (private for now, so SSH). Pin with `rev` / `tag` for releases.
fuide = { git = "ssh://git@github.com/kobago/fuide" }

# Developing the `fuide` crate alongside this app? Point Cargo at the sibling checkout
# (uncomment; do not commit):
# [patch."ssh://git@github.com/kobago/fuide"]
# fuide = { path = "../fuide/crates/fuide" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
